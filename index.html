<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>의정부시 | 기상 통합상황판</title><style>
:root{--bg:#080f1d;--panel:#101c2e;--line:#26374c;--muted:#97abc3;--text:#e9f2fc;--cyan:#47dfcc;--blue:#5ba9ff;--amber:#ffbd66}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px 'Pretendard','Noto Sans KR',system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column}header{display:flex;align-items:center;justify-content:space-between;padding:19px 28px;border-bottom:1px solid var(--line);gap:20px}.brand{display:flex;gap:13px;align-items:center}.logo{width:40px;height:40px;border:1px solid var(--cyan);border-radius:10px;display:grid;place-items:center;color:var(--cyan);font-size:27px;background:#123435}.eyebrow{font-size:10px;letter-spacing:2px;color:var(--cyan);margin-bottom:3px}h1{font-size:24px;letter-spacing:-1px;margin:0}.clock{text-align:right;font-size:23px;font-variant-numeric:tabular-nums}.date{font-size:11px;color:var(--muted);margin-top:3px}main{width:100%;max-width:2400px;margin:auto;padding:16px 28px;flex:1;display:flex;flex-direction:column;gap:16px}.statusbar{padding:11px 15px;border:1px solid var(--line);background:#132236;border-radius:7px;display:flex;justify-content:space-between;gap:15px;font-size:12px;color:#c5d6e7}.statusbar.error{border-color:#6f502c;color:var(--amber)}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--cyan);margin-right:7px}.board{display:grid;grid-template-columns:1fr 1fr;gap:18px;flex:1;min-height:0}.station{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px 20px;min-width:0;display:flex;flex-direction:column;gap:15px}.station-head{display:flex;align-items:center;justify-content:space-between;gap:12px}.station-title{display:flex;align-items:center;gap:10px}h2{font-size:25px;letter-spacing:-.7px;margin:0}.station-no{font-size:11px;color:var(--muted)}.badge{font-size:11px;background:#153b3d;color:var(--cyan);padding:5px 9px;border-radius:5px}.badge.warn{background:#3c2c1b;color:var(--amber)}.observed{font-size:12px;c gap:20px}}@media(max-height:1050px) and (min-width:901px){header{padding:12px 24px}main{padding:12px 24px;gap:10px}.station{padding:13px 16px;gap:10px}.metric{padding:9px 12px}.metric-value{font-size:27px;margin-top:5px}.chart{height:135px}.detail{gap:9px}.meta{font-size:9px}footer{padding-bottom:9px}}@media(max-width:900px){.board{grid-template-columns:1fr}header{padding:16px}main{padding:14px}h1{font-size:19px}.clock{font-size:18px}.statusbar{flex-wrap:wrap}footer{padding:0 14px 14px;flex-direction:column;gap:2px}}@media(max-width:480px){.eyebrow{font-size:8px;letter-spacing:1px}.logo{display:none}.date{font-size:9px}.metric-value{font-size:25px}.metric{padding:11px 9px}.station{padding:14px}.legend{font-size:9px;gap:7px}.detail strong{font-size:15px}}
.header-actions{display:flex;align-items:center;gap:20px}.refresh-button{display:inline-flex;align-items:center;gap:7px;min-height:40px;padding:9px 15px;border:1px solid #399eaa;border-radius:7px;background:#14353d;color:#a5fff0;font:inherit;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}.refresh-button:hover{background:#1b4851}.refresh-button:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}.refresh-button:disabled{opacity:.65;cursor:wait}@media(max-width:600px){.header-actions{gap:10px}.refresh-button{padding:8px 10px;font-size:12px}.clock{font-size:15px}}</style></head><body><header><div class="brand"><div class="logo">◈</div><div><div class="eyebrow">UIJEONGBU · WEATHER OPERATIONS</div><h1>의정부시 기상 통합상황판</h1></div></div><div class="header-actions"><button type="button" class="refresh-button" id="refreshButton" aria-label="최근 배포된 기상 JSON 다시 읽기" title="배포된 JSON을 다시 읽습니다. API 즉시 수집은 GitHub Actions의 collect에서 실행하세요.">↻ 새로고침</button><div class="clock"><span id="clock"></span><div class="date" id="date"></div></div></div></header><main><div class="statusbar" id="statusbar"><span id="status">관측자료 연결 중…</span><span id="requestTime">접속 시 자동조회 · 30분마다 갱신</span></div><div class="board" id="board"></div></main><footer><span>자료: 경기데이터드림 AWS 시간별 관측현황 · 연구·참고용 / 증빙자료 사용 불가 · 공식 특보 별도 확인</span><span><span id="refreshPolicy">30분 자동조회 · 수집 예약 05·35분</span> · 시간 표기 KST · 새로고침: 배포 JSON 재조회</span></footer><script>
// A measurement timestamp alone is not evidence of the provider's publication time.
function publicationPolicy(env={}) {
  const raw=env.AWS_VERIFIED_PUBLISH_MINUTE;
  const minute=typeof raw==='string'&&/^([0-9]|[1-5][0-9])$/.test(raw)?Number(raw):null;
  const verified=minute!==null&&env.AWS_PUBLICATION_VERIFIED==='true';
  return verified?{mode:'hourly',minute}:{mode:'half-hour',minute:null};
}
function nextRefreshAt(now,policy,healthy=true) {
  if(!healthy||policy?.mode!=='hourly'||!Number.isInteger(policy.minute)||policy.minute<0||policy.minute>59)return now+1800000;
  // KST has a whole-hour offset; minute boundaries equal UTC minute boundaries.
  const slot=Math.floor(now/3600000)*3600000+policy.minute*60000;
  return slot>now?slot:slot+3600000;
}
function refreshLabel(policy,healthy=true) {
  return healthy&&policy?.mode==='hourly'?'매시간 '+String(policy.minute).padStart(2,'0')+'분 조회':'JSON 30분 자동확인';
}


const $=s=>document.querySelector(s),targets=['의정부','신곡'];let rows=[],historyRows=[],historyBusy=false,historyError='',cacheShown=false,busy=false,lastSuccess=null,error='',policy={mode:'half-hour',minute:null},policyHealthy=false,nextAt=null,refreshTimer=null;
const esc=s=>String(s??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const n=v=>v===null||v===undefined||String(v).trim()===''||!Number.isFinite(Number(v))||Number(v)<=-90?null:Number(v);const fmt=(v,d=1)=>n(v)===null?'—':Number(v).toFixed(d);
function stamp(r){const d=String(r.MESURE_DE??'').replace(/\D/g,'').slice(0,8),t=String(r.MESURE_TM??'').replace(/\D/g,'').padStart(2,'0');return d+'T'+t.padEnd(4,'0').slice(0,4)}
function timeMs(r){const s=stamp(r);return Date.parse(s.slice(0,4)+'-'+s.slice(4,6)+'-'+s.slice(6,8)+'T'+s.slice(9,11)+':'+s.slice(11,13)+':00+09:00')}
function tm(r){const s=stamp(r);return s.slice(9,11)+':'+s.slice(11,13)}function dateLabel(r){const s=stamp(r);return s.slice(0,4)+'.'+s.slice(4,6)+'.'+s.slice(6,8)+' '+tm(r)}
const normalized=v=>String(v??'').replace(/\s|관측지점|관측소|지점/g,'');function matches(r,name){return normalized(r.SPOT_NM)===name}const windDir=v=>n(v)===null?'—':['북','북동','동','남동','남','남서','서','북서'][Math.round(Number(v)/45)%8];
function chart(data,name){if(!data.length)return '<div class="empty">시간별 관측자료 수신 대기</div>';const rainMax=Math.max(1,...data.map(r=>n(r.RAINF_1HR_INFO)||0)),temps=data.map(r=>n(r.TP_INFO)).filter(v=>v!==null),tMin=temps.length?Math.floor(Math.min(...temps)/5)*5:0,tMax=temps.length?Math.max(tMin+5,Math.ceil(Math.max(...temps)/5)*5):5;let svg='<svg viewBox="0 0 680 175" role="img" aria-label="'+name+' 지점 기온 및 시간강수량 추이">';for(let i=0;i<4;i++){const y=17+i*38;svg+='<path d="M36 '+y+'H641" stroke="#293c53" stroke-dasharray="3 4"/><text x="0" y="'+(y+4)+'" fill="#96aec7" font-size="10">'+Math.round(tMax-(tMax-tMin)*i/3)+'°</text><text x="648" y="'+(y+4)+'" fill="#5ba9ff" font-size="10">'+fmt(rainMax*(1-i/3),1)+'</text>'}let path='',prev=null;data.forEach((r,i)=>{const x=data.length===1?338:45+i*588/(data.length-1),v=n(r.RAINF_1HR_INFO),t=n(r.TP_INFO);if(v!==null)svg+='<rect x="'+(x-5)+'" y="'+(131-v/rainMax*110)+'" width="10" height="'+(v/rainMax*110)+'" rx="2" fill="#5ba9ff" opacity=".55"/>';if(t!==null){const y=17+(tMax-t)/(tMax-tMin)*114,gap=prev&&timeMs(r)-timeMs(prev)>3600000;path+=(prev&&!gap?'L':'M')+x+','+y+' ';svg+='<circle cx="'+x+'" cy="'+y+'" r="2.5" fill="#47dfcc"/>';prev=r}else prev=null;if(i%Math.max(1,Math.ceil(data.length/5))===0||i===data.length-1)svg+='<text x="'+x+'" y="157" text-anchor="middle" fill="#96aec7" font-size="10">'+tm(r)+'</text>'});return svg+'<path d="'+path+'" fill="none" stroke="#47dfcc" stroke-width="2.5"/></svg>'}
function render(){$('#refreshButton').disabled=busy;$('#refreshButton').textContent=busy?'조회 중…':'↻ 새로고침';let available=0;$('#board').innerHTML=targets.map(name=>{const data=historyRows.filter(r=>matches(r,name)).sort((a,b)=>stamp(a).localeCompare(stamp(b))).slice(-24),r=rows.filter(r=>matches(r,name)).sort((a,b)=>stamp(a).localeCompare(stamp(b))).at(-1)||{},has=!!r.SPOT_NM,age=(Date.now()-timeMs(r))/60000,stale=has&&age>180;if(has)available++;const metrics=[['시간강수량',r.RAINF_1HR_INFO,'mm'],['일 누적강수량',r.RAINF_DAY_INFO,'mm'],['기온',r.TP_INFO,'℃'],['습도',r.HD_INFO,'%'],['풍속',r.WS_INFO,'m/s'],['풍향',r.WD_INFO,'°']];const checks=[];if(n(r.RAINF_1HR_INFO)!==null&&+r.RAINF_1HR_INFO>=15)checks.push('시간강수량 15 mm 이상');if(n(r.TP_INFO)!==null&&+r.TP_INFO>=33)checks.push('기온 33 ℃ 이상');if(n(r.WS_INFO)!==null&&+r.WS_INFO>=10)checks.push('풍속 10 m/s 이상');return '<section class="station" aria-label="'+name+' 지점"><div><div class="station-head"><div class="station-title"><h2>'+name+' 지점</h2><span class="station-no">AWS '+esc(r.SPOT_NO)+'</span></div><span class="badge '+(!has||stale||error?'warn':'')+'">'+(!has?'자료 없음':error?'이전 수신자료':stale?'갱신 지연':'관측자료 수신')+'</span></div><div class="observed">관측시각 '+(has?dateLabel(r)+' KST':'—')+'</div></div><div class="metrics">'+metrics.map(([label,val,unit],i)=>'<article class="metric '+(i<2?'primary':'')+'"><div class="metric-label">'+label+'</div><div class="metric-value">'+fmt(val,i===3||i===5?0:1)+'<span class="unit">'+unit+'</span></div></article>').join('')+'</div><section class="trend"><div class="trend-head"><h3>시간별 관측추이</h3><div class="legend"><span style="color:var(--cyan)">━ 기온 (℃)</span><span style="color:var(--blue)">▥ 시간강수량 (mm)</span></div></div><div class="chart">'+(data.length?chart(data,name):'<div class="empty">'+(historyBusy?'시간별 그래프 불러오는 중…':historyError?'시간별 자료 조회 실패 · 다음 조회 시 재시도':'최근 시간별 관측자료 없음')+'</div>')+'</div><div class="chart-note">'+(data.length?dateLabel(data[0])+' ~ '+dateLabel(data.at(-1))+' · '+data.length+'개 관측시각':'최근 24시간 내 관측시각')+(historyError&&data.length?' · 이전 그래프 유지':'')+' · 결측 구간 미연결</div></section><div class="detail">'+[['현지기압',fmt(r.LOCTN_ATM_INFO),'hPa'],['해면기압',fmt(r.WTRLVL_ATM_INFO),'hPa'],['강수 감지',r.RAINF_YN_INFO==null?'—':String(r.RAINF_YN_INFO)==='1'?'감지':String(r.RAINF_YN_INFO)==='0'?'미감지':'확인 필요',''],['바람 방향',windDir(r.WD_INFO),''],['고도',fmt(r.HT_INFO),'m'],['유효 수치',['TP_INFO','HD_INFO','WS_INFO','WD_INFO','LOCTN_ATM_INFO','WTRLVL_ATM_INFO','RAINF_1HR_INFO','RAINF_DAY_INFO'].filter(k=>n(r[k])!==null).length+' / 8','']].map(([a,b,c])=>'<div><span>'+a+'</span><strong>'+b+'</strong><small>'+c+'</small></div>').join('')+'</div><div class="notice '+(!checks.length?'ok':'')+'">'+(!has?'관측자료 수신 후 상황 확인 항목을 표시합니다.':checks.length?'참고 기준 해당: '+checks.join(' · ')+' · 현장 확인 검토':'유효자료 내 참고 기준 해당 없음')+'</div><div class="meta">'+esc(r.SIGUN_NM||'의정부시')+' · '+esc(r.LEGALDONG_NM)+' · 시군코드 '+esc(r.SIGUN_CD)+' · 위도 '+fmt(r.WGS84_LAT,4)+' / 경도 '+fmt(r.WGS84_LOGT,4)+'<br>참고 기준: 시간강수량 15 mm · 고온 33 ℃ · 풍속 10 m/s / 공식 특보와 별도</div></section>'}).join('');$('#statusbar').classList.toggle('error',!!error);$('#status').innerHTML=error?esc(error)+(lastSuccess?' · 이전 수신자료 유지':' · 관측값 수신 대기'):busy&&!available?'관측자료 연결 중…':'<span class="dot"></span>의정부·신곡 '+available+'/2개 지점 수신'+(available<2?' · 미수신 지점은 — 표시':'')+(cacheShown?' · 서버 보관자료':'')+(busy&&available?' · 최신자료 확인 중…':'');$('#requestTime').textContent=lastSuccess?'마지막 수신 '+lastSuccess.toLocaleString('ko-KR',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false,timeZone:'Asia/Seoul'})+' · '+refreshLabel(policy,policyHealthy):'접속 시 자동조회 · 30분마다 갱신';$('#refreshPolicy').textContent=refreshLabel(policy,policyHealthy)+(policy.mode==='hourly'?(policyHealthy?' · 게시시각 확인':' · 자료 확인 대기'):' · 수집 예약 05·35분');if(nextAt)$('#requestTime').textContent+=' · 다음 '+new Date(nextAt).toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',hour12:false,timeZone:'Asia/Seoul'})}
let snapshotRequest=null;
async function requestData(view,refresh=false){
  if(!snapshotRequest)snapshotRequest=(async()=>{const response=await fetch('./data/observations.json?t='+Date.now(),{signal:AbortSignal.timeout(15000),cache:'no-store'});if(!response.ok)throw Error('기상 JSON을 읽지 못했습니다 ('+response.status+')');return response.json();})();
  const snapshot=await snapshotRequest;if(!Array.isArray(snapshot.rows))throw Error('관측자료 JSON 형식 오류');
  const valid=snapshot.rows.filter(r=>targets.some(name=>matches(r,name))&&Number.isFinite(timeMs(r))&&timeMs(r)<=Date.now()+300000);
  const data=view==='history'?valid.filter(r=>Date.now()-timeMs(r)<=86400000):targets.flatMap(name=>valid.filter(r=>matches(r,name)).sort((a,b)=>timeMs(a)-timeMs(b)).slice(-1));
  return {rows:data,fetched:snapshot.generatedAt,refreshPolicy:{mode:'half-hour',minute:null},cached:false,pending:false,error:snapshot.error||''};
}
function applyLatest(data){
  rows=data.rows;lastSuccess=data.fetched?new Date(data.fetched):null;cacheShown=!!data.cached;
  policy=data.refreshPolicy||{mode:'half-hour',minute:null};error=data.error||data.warning||'';
  policyHealthy=!error&&targets.every(name=>{const latest=rows.filter(r=>matches(r,name)).map(timeMs).filter(Number.isFinite).sort((a,b)=>b-a)[0];return latest!==undefined&&Date.now()-latest>=-300000&&Date.now()-latest<=5400000});render();
}
async function loadHistory(){
  historyBusy=true;historyError='';render();
  try{
    let data=await requestData('history');historyRows=data.rows;historyError=data.error||data.warning||'';render();
    for(let attempt=0;data.pending&&attempt<12;attempt++){await new Promise(resolve=>setTimeout(resolve,1500));data=await requestData('history');historyRows=data.rows;historyError=data.error||data.warning||'';render();}
  }catch(e){historyError=e.message||'시간별 자료 조회 실패';}
  finally{historyBusy=false;render();}
}
async function load(manual=false){
  if(busy)return;busy=true;snapshotRequest=null;error='';render();
  try{
    const data=await requestData('latest',manual);applyLatest(data);
    // Give the browser a paint before requesting the separate trend dataset.
    await new Promise(resolve=>setTimeout(resolve,0));
    await Promise.all([
      loadHistory(),
      (async()=>{let current=data;for(let attempt=0;current.pending&&attempt<12;attempt++){await new Promise(resolve=>setTimeout(resolve,1500));current=await requestData('latest');applyLatest(current);}})().catch(e=>{error='JSON 조회 실패 · '+(e.message||'연결 상태 확인');policyHealthy=false;render();})
    ]);
  }catch(e){
    error='JSON 조회 실패 · '+(e.message||'연결 상태 확인');policyHealthy=false;
    // A latest-value outage must not prevent a saved graph from loading.
    await loadHistory();
  }finally{
    busy=false;clearTimeout(refreshTimer);nextAt=nextRefreshAt(Date.now(),policy,policyHealthy);refreshTimer=setTimeout(load,Math.max(0,nextAt-Date.now()));render();
  }
}
$('#refreshButton').onclick=()=>load(true);
function clock(){const now=new Date();$('#clock').textContent=now.toLocaleTimeString('ko-KR',{hour12:false,timeZone:'Asia/Seoul'});$('#date').textContent=now.toLocaleDateString('ko-KR',{year:'numeric',month:'long',day:'numeric',weekday:'long',timeZone:'Asia/Seoul'})}clock();setInterval(clock,1000);if(typeof initialSnapshot!=='undefined'){historyRows=initialSnapshot.rows.filter(r=>Date.now()-timeMs(r)<=86400000);applyLatest(initialSnapshot);}load();
</script></body></html>
