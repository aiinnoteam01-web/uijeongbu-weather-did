name: check

on:
  workflow_run:
    workflows: [collect]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.head_branch == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: 저장된 JSON 가져오기
        uses: actions/checkout@v6
        with:
          ref: data
          path: _snapshot

      - name: 저장된 기상자료 점검
        run: python3 scripts/check_data.py --data-dir _snapshot/data
